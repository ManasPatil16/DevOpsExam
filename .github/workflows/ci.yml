
name: Java CI Testing

on:
  push:
  pull_request:

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      # Step 1: Download project code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Java 23
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      # Step 3: Build and execute test cases
      - name: Build and Test
        run: mvn clean test
